<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>solcity</title>
  <rect width="32" height="32" rx="7" fill="#12152a"/>
  <!-- three high-rises: violet, orange (tallest, with antenna), cyan -->
  <rect x="4.5" y="13" width="7" height="13" rx="1" fill="#8b6cff"/>
  <rect x="12.5" y="7" width="7" height="19" rx="1" fill="#fb923c"/>
  <rect x="20.5" y="10.5" width="7" height="15.5" rx="1" fill="#22d3ee"/>
  <!-- lit windows -->
  <g fill="#fff7d6">
    <rect x="6" y="15" width="1.8" height="1.6"/><rect x="8.6" y="15" width="1.8" height="1.6" opacity=".45"/>
    <rect x="6" y="18.2" width="1.8" height="1.6" opacity=".45"/><rect x="8.6" y="18.2" width="1.8" height="1.6"/>
    <rect x="6" y="21.4" width="1.8" height="1.6"/><rect x="8.6" y="21.4" width="1.8" height="1.6"/>
    <rect x="14" y="9" width="1.8" height="1.6"/><rect x="16.6" y="9" width="1.8" height="1.6"/>
    <rect x="14" y="12.2" width="1.8" height="1.6" opacity=".45"/><rect x="16.6" y="12.2" width="1.8" height="1.6"/>
    <rect x="14" y="15.4" width="1.8" height="1.6"/><rect x="16.6" y="15.4" width="1.8" height="1.6" opacity=".45"/>
    <rect x="14" y="18.6" width="1.8" height="1.6"/><rect x="16.6" y="18.6" width="1.8" height="1.6"/>
    <rect x="14" y="21.8" width="1.8" height="1.6" opacity=".45"/><rect x="16.6" y="21.8" width="1.8" height="1.6"/>
    <rect x="22" y="12.5" width="1.8" height="1.6" opacity=".45"/><rect x="24.6" y="12.5" width="1.8" height="1.6"/>
    <rect x="22" y="15.7" width="1.8" height="1.6"/><rect x="24.6" y="15.7" width="1.8" height="1.6"/>
    <rect x="22" y="18.9" width="1.8" height="1.6"/><rect x="24.6" y="18.9" width="1.8" height="1.6" opacity=".45"/>
    <rect x="22" y="22.1" width="1.8" height="1.6"/><rect x="24.6" y="22.1" width="1.8" height="1.6"/>
  </g>
  <!-- antenna with a red light -->
  <rect x="15.6" y="3" width="0.8" height="4" fill="#cbd5e1"/>
  <circle cx="16" cy="3" r="1.2" fill="#ff4d6d"/>
  <!-- street -->
  <rect x="3.5" y="26" width="25" height="1.6" rx=".8" fill="#2b3150"/>
</svg>
